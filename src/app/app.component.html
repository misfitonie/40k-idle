<div class="game">

  <div class="combatants">

    <div class="card marine">
      <h2>{{ state.marine().name }}</h2>
      <p>{{ state.marine().type | uppercase }} — Lvl {{ state.marine().level }}</p>
      <div class="bar-wrap">
        <div class="bar hp"
          [style.width.%]="(state.marine().hp / state.marine().maxHp) * 100">
        </div>
      </div>
      <p>{{ state.marine().hp }} / {{ state.marine().maxHp }} HP</p>
    </div>

    <div class="vs">VS</div>

    <div class="card enemy">
      <h2>{{ state.enemy().name }}</h2>
      <div class="bar-wrap">
        <div class="bar hp enemy-hp"
          [style.width.%]="(state.enemy().hp / state.enemy().maxHp) * 100">
        </div>
      </div>
      <p>{{ state.enemy().hp }} / {{ state.enemy().maxHp }} HP</p>
    </div>

  </div>

  <div class="log">
    <div *ngFor="let line of state.combatLog()">{{ line }}</div>
  </div>

</div>
